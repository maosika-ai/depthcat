[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reshot"
dynamic = ["version"]
description = "ReShot — copy the shot, not the actors. Video → depth map, OpenPose skeleton or canny lines for Seedance 2.0/2.5 reference video, MiniMax H3 Fun ControlNet and Wan VACE. Open-sourced by Maosika 猫斯卡 (www.maosika.com), the AI short-drama production system."
readme = "docs/PYPI.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Maosika 猫斯卡" }]
keywords = ["video", "depth", "pose", "openpose", "dwpose", "canny", "controlnet", "video-generation", "depth-map", "depth-anything", "seedance", "minimax-h3", "ai-short-drama", "maosika"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Graphics",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "einops>=0.4",
  "easydict",
  "tqdm",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.4.7"]   # bundled ffmpeg if none on PATH
pose = ["onnxruntime>=1.16"]         # --control pose (DWPose); on CUDA install onnxruntime-gpu instead
dev = ["pytest>=8", "ruff", "onnxruntime>=1.16"]

[project.scripts]
reshot = "reshot.cli:main"

[project.urls]
Homepage = "https://github.com/maosika-ai/reshot"
Documentation = "https://github.com/maosika-ai/reshot/blob/main/docs/USAGE.md"
"ComfyUI nodes" = "https://github.com/maosika-ai/ComfyUI-ReShot"
Changelog = "https://github.com/maosika-ai/reshot/blob/main/CHANGELOG.md"
Maosika = "https://www.maosika.com"

[tool.setuptools.dynamic]
version = { attr = "reshot._version.__version__" }

[tool.setuptools.packages.find]
include = ["reshot*"]

[tool.setuptools.package-data]
"reshot.third_party.video_depth_anything" = ["LICENSE"]
"reshot" = ["py.typed"]
"reshot.web" = ["index.html"]

[tool.ruff]
line-length = 120
extend-exclude = ["reshot/third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # E501: formatter; RUF00x: unicode ×→ in comments is intentional
