[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reshot"
dynamic = ["version"]
description = "ReShot — copy the shot, not the actors. Video → depth blockout for Seedance 2.0/2.5 reference video, MiniMax H3 Fun ControlNet and Wan VACE. Open-sourced by Maosika 猫斯卡 (www.maosika.com), the AI short-drama production system."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Maosika 猫斯卡" }]
keywords = ["video", "depth", "controlnet", "video-generation", "blockout", "depth-anything", "seedance", "minimax-h3", "ai-short-drama", "maosika"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "einops>=0.4",
  "easydict",
  "tqdm",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.4.7"]   # bundled ffmpeg if none on PATH
dev = ["pytest>=8", "ruff"]

[project.scripts]
reshot = "reshot.cli:main"

[project.urls]
Homepage = "https://github.com/maosika-ai/reshot"
Maosika = "https://www.maosika.com"

[tool.setuptools.dynamic]
version = { attr = "reshot._version.__version__" }

[tool.setuptools.packages.find]
include = ["reshot*"]

[tool.setuptools.package-data]
"reshot.third_party.video_depth_anything" = ["LICENSE"]
"reshot" = ["py.typed"]

[tool.ruff]
line-length = 120
extend-exclude = ["reshot/third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # E501: formatter; RUF00x: unicode ×→ in comments is intentional
