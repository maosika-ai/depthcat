[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depthcat"
dynamic = ["version"]
description = "Turn any video into a depth blockout video for video-generation ControlNets (MiniMax H3, Wan VACE, ...)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Maoska" }]
keywords = ["video", "depth", "controlnet", "video-generation", "blockout", "depth-anything"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "einops>=0.4",
  "easydict",
  "tqdm",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.4.7"]   # bundled ffmpeg if none on PATH
dev = ["pytest>=8", "ruff"]

[project.scripts]
depthcat = "depthcat.cli:main"

[project.urls]
Homepage = "https://github.com/maosika-ai/depthcat"

[tool.setuptools.dynamic]
version = { attr = "depthcat._version.__version__" }

[tool.setuptools.packages.find]
include = ["depthcat*"]

[tool.setuptools.package-data]
"depthcat.third_party.video_depth_anything" = ["LICENSE"]
"depthcat" = ["py.typed"]

[tool.ruff]
line-length = 120
extend-exclude = ["depthcat/third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # E501: formatter; RUF00x: unicode ×→ in comments is intentional
